spring:
  application:
    name: employee-management
  profiles:
    active: dev
  cache:
    type: caffeine
    cache-names:
      - employeeReports
    caffeine:
      spec: expireAfterWrite=60s,maximumSize=100

jwt:
  secret: ${JWT_SECRET:change-me-very-strong-secret-key-123456}
  expiration-ms: 86400000

logging:
  level:
    root: info
    com.example.employeemanagement: info

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      show-details: never
