<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Employee</title>
</head>
<body>
    <h1>Add Employee</h1>

    <form th:action="@{/employees/add}" th:object="${employee}" method="post">
        <div>
            <label for="fullName">Full Name</label>
            <input id="fullName" type="text" th:field="*{fullName}">
            <span th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}">Name error</span>
        </div>

        <div>
            <label for="email">Email</label>
            <input id="email" type="email" th:field="*{email}">
            <span th:if="${#fields.hasErrors('email')}" th:errors="*{email}">Email error</span>
        </div>

        <div>
            <label for="department">Department</label>
            <input id="department" type="text" th:field="*{department.name}">
        </div>

        <button type="submit">Save</button>
    </form>

    <p>
        <a th:href="@{/employees/list}">Back to Employee List</a>
    </p>
</body>
</html>
